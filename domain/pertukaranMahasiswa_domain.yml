version: "3.1"

intents:
  - pertukaranMahasiswa_menu
  - prosedur_pertukaranMahasiswa
  - persyaratan_pertukaranMahasiswa
  - transaksi_pertukaranMahasiswa
  - hasil_pertukaranMahasiswa

slots:
  menu_pertukaranMahasiswa:
    type: categorical
    influence_conversation: false
    values:
      - "Prosedur Pertukaran Mahasiswa"
      - "Persyaratan Pertukaran Mahasiswa"
      - "Transaksi Pertukaran Mahasiswa"
      - "Hasil Pertukaran Mahasiswa"
      - "Student Exchange Procedure"
      - "Student Exchange Requirements"
      - "Student Exchange Transaction"
      - "Student Exchange Results"
    mappings:
      - type: custom

  menu_pertukaranMahasiswa_confirmation:
    type: bool
    influence_conversation: false
    mappings:
      - type: custom

responses:
  utter_ask_menu_pertukaranMahasiswa:
    - text: "Silakan pilih salah satu opsi pertukaran mahasiswa berikut:"
      buttons:
        - title: "Prosedur Pertukaran Mahasiswa"
          payload: "/prosedur_pertukaranMahasiswa"
        - title: "Persyaratan Pertukaran Mahasiswa"
          payload: "/persyaratan_pertukaranMahasiswa"
        - title: "Transaksi Pertukaran Mahasiswa"
          payload: "/transaksi_pertukaranMahasiswa"
        - title: "Hasil Pertukaran Mahasiswa"
          payload: "/hasil_pertukaranMahasiswa"

  utter_ask_menu_pertukaranMahasiswa_confirmation:
    - text: "Anda telah memilih opsi: {menu_pertukaranMahasiswa}. Apakah itu benar?"
      buttons:
        - title: "Ya"
          payload: "/affirm"
        - title: "Tidak"
          payload: "/deny"

  utter_menu_pertukaranMahasiswa_cancelled:
    - text: "Baik, mari coba lagi. Silakan pilih salah satu opsi pertukaran mahasiswa."

  utter_menu_pertukaranMahasiswa_ok:
    - text: "Anda telah berhasil memilih opsi pertukaran mahasiswa: {menu_pertukaranMahasiswa}."

  utter_answer_prosedur_pertukaranMahasiswa:
    - text: "PROSEDUR PERTUKARAN MAHASISWA"

  utter_answer_persyaratan_pertukaranMahasiswa:
    - text: "PERSYARATAN PERTUKARAN MAHASISWA"

  utter_answer_transaksi_pertukaranMahasiswa:
    - text: "Silakan lengkapi data pengajuan pertukaran mahasiswa dan ajukan permohonan pertukaran mahasiswa."

  utter_answer_hasil_pertukaranMahasiswa:
    - text: "Pengajuan pertukaran mahasiswa kamu telah diproses."

  utter_answer_error_pertukaranMahasiswa:
    - text: "Maaf, menu tidak ditemukan. Silakan pilih opsi yang tersedia."

actions:
  - action_answer_pertukaranMahasiswa
  - action_ask_confirmation_pertukaranMahasiswa
  - action_deny_pertukaranMahasiswa
