version: "3.1"

intents:
  - absensiKelas_menu
  - prosedur_absensiKelas
  - persyaratan_absensiKelas
  - transaksi_absensiKelas
  - hasil_absensiKelas

slots:
  menu_absensiKelas:
    type: categorical
    influence_conversation: false
    values:
      - "Prosedur Absensi Kelas"
      - "Persyaratan Absensi Kelas"
      - "Transaksi Absensi Kelas"
      - "Hasil Absensi Kelas"
      - "Class Attendance Procedure"
      - "Class Attendance Requirements"
      - "Class Attendance Transaction"
      - "Class Attendance Results"
    mappings:
      - type: custom

  menu_absensiKelas_confirmation:
    type: bool
    influence_conversation: false
    mappings:
      - type: custom

responses:
  utter_ask_menu_absensiKelas:
    - text: "Silakan pilih salah satu opsi Absensi Kelas berikut:"
      buttons:
        - title: "Prosedur Absensi Kelas"
          payload: "/prosedur_absensiKelas"
        - title: "Persyaratan Absensi Kelas"
          payload: "/persyaratan_absensiKelas"
        - title: "Transaksi Absensi Kelas"
          payload: "/transaksi_absensiKelas"
        - title: "Hasil Absensi Kelas"
          payload: "/hasil_absensiKelas"

  utter_ask_menu_absensiKelas_confirmation:
    - text: "Anda telah memilih opsi: {menu_absensiKelas}. Apakah itu benar?"
      buttons:
        - title: "Ya"
          payload: "/affirm"
        - title: "Tidak"
          payload: "/deny"

  utter_menu_absensiKelas_cancelled:
    - text: "Baik, mari coba lagi. Silakan pilih salah satu opsi Absensi Kelas."

  utter_menu_absensiKelas_ok:
    - text: "Anda telah berhasil memilih opsi Absensi Kelas: {menu_absensiKelas}."

  utter_answer_prosedur_absensiKelas:
    - text: "PROSEDUR ABSENSI KELAS"

  utter_answer_persyaratan_absensiKelas:
    - text: "PERSYARATAN ABSENSI KELAS"

  utter_answer_transaksi_absensiKelas:
    - text: "Silakan lengkapi data Absensi Kelas."

  utter_answer_hasil_absensiKelas:
    - text: "Pengajuan Absensi Kelas kamu telah diproses."

  utter_answer_error_absensiKelas:
    - text: "Maaf, menu tidak ditemukan. Silakan pilih opsi yang tersedia."

actions:
  - action_answer_absensiKelas
  - action_ask_confirmation_absensiKelas
  - action_deny_absensiKelas
