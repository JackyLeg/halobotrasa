version: "3.1"

intents:
  - persetujuanPengisianKrs_menu
  - prosedur_persetujuanPengisianKrs
  - persyaratan_persetujuanPengisianKrs
  - transaksi_persetujuanPengisianKrs
  - hasil_persetujuanPengisianKrs

slots:
  menu_persetujuanPengisianKrs:
    type: categorical
    influence_conversation: false
    values:
      - "Prosedur Persetujuan Pengisian KRS"
      - "Persyaratan Persetujuan Pengisian KRS"
      - "Transaksi Persetujuan Pengisian KRS"
      - "Hasil Persetujuan Pengisian KRS"
      - "KRS Submission Approval Procedure"
      - "KRS Submission Approval Requirements"
      - "KRS Submission Approval Transaction"
      - "KRS Submission Approval Results"
    mappings:
      - type: custom

  menu_persetujuanPengisianKrs_confirmation:
    type: bool
    influence_conversation: false
    mappings:
      - type: custom

responses:
  utter_ask_menu_persetujuanPengisianKrs:
    - text: "Silakan pilih salah satu opsi Persetujuan Pengisian KRS berikut:"
      buttons:
        - title: "Prosedur Persetujuan Pengisian KRS"
          payload: "/prosedur_persetujuanPengisianKrs"
        - title: "Persyaratan Persetujuan Pengisian KRS"
          payload: "/persyaratan_persetujuanPengisianKrs"
        - title: "Transaksi Persetujuan Pengisian KRS"
          payload: "/transaksi_persetujuanPengisianKrs"
        - title: "Hasil Persetujuan Pengisian KRS"
          payload: "/hasil_persetujuanPengisianKrs"

  utter_ask_menu_persetujuanPengisianKrs_confirmation:
    - text: "Anda telah memilih opsi: {menu_persetujuanPengisianKrs}. Apakah itu benar?"
      buttons:
        - title: "Ya"
          payload: "/affirm"
        - title: "Tidak"
          payload: "/deny"

  utter_menu_persetujuanPengisianKrs_cancelled:
    - text: "Baik, mari coba lagi. Silakan pilih salah satu opsi Persetujuan Pengisian KRS."

  utter_menu_persetujuanPengisianKrs_ok:
    - text: "Anda telah berhasil memilih opsi Persetujuan Pengisian KRS: {menu_persetujuanPengisianKrs}."

  utter_answer_prosedur_persetujuanPengisianKrs:
    - text: "PROSEDUR PERSETUJUAN PENGISIAN KRS"

  utter_answer_persyaratan_persetujuanPengisianKrs:
    - text: "PERSYARATAN PERSETUJUAN PENGISIAN KRS"

  utter_answer_transaksi_persetujuanPengisianKrs:
    - text: "Silakan lengkapi data Persetujuan Pengisian KRS."

  utter_answer_hasil_persetujuanPengisianKrs:
    - text: "Pengajuan Persetujuan Pengisian KRS kamu telah diproses."

  utter_answer_error_persetujuanPengisianKrs:
    - text: "Maaf, menu tidak ditemukan. Silakan pilih opsi yang tersedia."

actions:
  - action_answer_persetujuanPengisianKrs
  - action_ask_confirmation_persetujuanPengisianKrs
  - action_deny_persetujuanPengisianKrs
