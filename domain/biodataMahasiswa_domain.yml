version: "3.1"

intents:
  - biodataMahasiswa_menu
  - prosedur_biodataMahasiswa
  - persyaratan_biodataMahasiswa
  - transaksi_biodataMahasiswa
  - hasil_biodataMahasiswa

slots:
  menu_biodataMahasiswa:
    type: categorical
    influence_conversation: false
    values:
      - "Prosedur Biodata Mahasiswa"
      - "Persyaratan Biodata Mahasiswa"
      - "Transaksi Biodata Mahasiswa"
      - "Hasil Biodata Mahasiswa"
      - "Student Profile Procedure"
      - "Student Profile Requirements"
      - "Student Profile Transaction"
      - "Student Profile Results"
    mappings:
      - type: custom

  menu_biodataMahasiswa_confirmation:
    type: bool
    influence_conversation: false
    mappings:
      - type: custom

responses:
  utter_ask_menu_biodataMahasiswa:
    - text: "Silakan pilih salah satu opsi Biodata Mahasiswa berikut:"
      buttons:
        - title: "Prosedur Biodata Mahasiswa"
          payload: "/prosedur_biodataMahasiswa"
        - title: "Persyaratan Biodata Mahasiswa"
          payload: "/persyaratan_biodataMahasiswa"
        - title: "Transaksi Biodata Mahasiswa"
          payload: "/transaksi_biodataMahasiswa"
        - title: "Hasil Biodata Mahasiswa"
          payload: "/hasil_biodataMahasiswa"

  utter_ask_menu_biodataMahasiswa_confirmation:
    - text: "Anda telah memilih opsi: {menu_biodataMahasiswa}. Apakah itu benar?"
      buttons:
        - title: "Ya"
          payload: "/affirm"
        - title: "Tidak"
          payload: "/deny"

  utter_menu_biodataMahasiswa_cancelled:
    - text: "Baik, mari coba lagi. Silakan pilih salah satu opsi Biodata Mahasiswa."

  utter_menu_biodataMahasiswa_ok:
    - text: "Anda telah berhasil memilih opsi Biodata Mahasiswa: {menu_biodataMahasiswa}."

  utter_answer_prosedur_biodataMahasiswa:
    - text: "PROSEDUR BIODATA MAHASISWA"

  utter_answer_persyaratan_biodataMahasiswa:
    - text: "PERSYARATAN BIODATA MAHASISWA"

  utter_answer_transaksi_biodataMahasiswa:
    - text: "Silakan lengkapi data Biodata Mahasiswa."

  utter_answer_hasil_biodataMahasiswa:
    - text: "Pengajuan Biodata Mahasiswa kamu telah diproses."

  utter_answer_error_biodataMahasiswa:
    - text: "Maaf, menu tidak ditemukan. Silakan pilih opsi yang tersedia."

actions:
  - action_answer_biodataMahasiswa
  - action_ask_confirmation_biodataMahasiswa
  - action_deny_biodataMahasiswa
