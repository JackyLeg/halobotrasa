version: "3.1"

stories:
# MENU profil #

  - story: beginning of flow profil
    steps:
      - intent: profil_menu
      - action: utter_ask_menu_profil
      - checkpoint: check_menu_profil

  - story: handle user menu profil
    steps:
      - checkpoint: check_menu_profil
      - or:
          - intent: ganti_password_profil
          - intent: keluar_profil
      - checkpoint: confirmation_menu_profil

  - story: direct option select profil
    steps:
      - or:
          - intent: ganti_password_profil
          - intent: keluar_profil
      - checkpoint: confirmation_menu_profil

  - story: confirmation ok profil
    steps:
      - checkpoint: confirmation_menu_profil
      - action: action_ask_confirmation_profil
      - intent: affirm
      - slot_was_set:
          - menu_profil_confirmation: true
      - checkpoint: affirm_menu_profil

  - story: confirmation cancel profil
    steps:
      - checkpoint: confirmation_menu_profil
      - action: action_ask_confirmation_profil
      - intent: deny
      - slot_was_set:
          - menu_profil_confirmation: false
      - action: action_deny_profil
      - checkpoint: check_menu_profil

  - story: handle after menu profil
    steps:
      - checkpoint: affirm_menu_profil
      - action: action_answer_profil
